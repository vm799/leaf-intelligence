<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Leaf Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 301 Redirect Meta -->
    <meta http-equiv="refresh" content="3;url=leafintelligence.html">
    <link rel="canonical" href="leafintelligence.html">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#3b82f6',
                        'secondary': '#10b981',
                        'accent': '#8b5cf6',
                        'dark': '#1e293b',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .fade-in {
            animation: fadeIn 0.8s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .progress-bar {
            animation: progress 3s linear forwards;
        }
        
        @keyframes progress {
            from { width: 0%; }
            to { width: 100%; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-50 via-blue-50 to-purple-50">
    <!-- Header matching your existing design -->
    <header class="bg-gradient-to-r from-emerald-50 via-blue-50 to-purple-50 relative shadow-lg">
        <!-- Glassmorphism overlay -->
        <div class="absolute inset-0 bg-white/60 backdrop-blur-md border-b border-white/20"></div>
        
        <div class="container mx-auto relative z-10">
            <nav class="flex justify-between items-center px-4 py-4">
                <!-- Logo/Brand section - Modern with gradients -->
                <div class="flex items-center space-x-3">
                    <div class="flex items-center">
                        <!-- Beautiful gradient leaf icon -->
                        <div class="relative">
                            <img src="leaf.png" alt="Leaf Intelligence" class="h-14 w-14 object-contain">
                            <!-- Subtle glow effect -->
                            <div class="absolute inset-0 bg-gradient-to-r from-emerald-400 to-cyan-400 opacity-20 blur-lg rounded-full"></div>
                        </div>
                        <div class="ml-3">
                            <span class="text-xl font-bold bg-gradient-to-r from-emerald-600 via-blue-600 to-purple-600 bg-clip-text text-transparent">
                                Leaf Intelligence
                            </span>
                            <div class="text-xs text-gray-600 font-medium tracking-wide">AI Research Platform</div>
                        </div>
                    </div>
                </div>
                
                <!-- Navigation placeholder -->
                <div class="flex items-center space-x-6">
                    <div class="relative bg-white/40 backdrop-blur-sm border border-white/30 text-gray-700 transition-all duration-300 flex items-center text-sm font-medium px-4 py-2 rounded-lg">
                        <span class="bg-gradient-to-r from-emerald-600 via-blue-600 to-purple-600 bg-clip-text text-transparent">
                            Pharmaceuticals intelligence
                        </span>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-screen px-4 -mt-20">
        <div class="text-center max-w-md mx-auto fade-in">
            <!-- Loading Animation -->
            <div class="mb-8">
                <div class="relative mx-auto w-24 h-24">
                    <!-- Outer ring -->
                    <div class="absolute inset-0 rounded-full border-4 border-gradient-to-r from-emerald-200 via-blue-200 to-purple-200"></div>
                    <!-- Spinning inner ring -->
                    <div class="absolute inset-2 rounded-full border-4 border-transparent border-t-emerald-500 border-r-blue-500 border-b-purple-500 pulse-animation"></div>
                    <!-- Center leaf icon -->
                    <div class="absolute inset-0 flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 2C8 2 5 5 5 9c0 2.5 1 4.5 2.5 6L12 22l4.5-7C18 13.5 19 11.5 19 9c0-4-3-7-7-7z" />
                            <path d="M12 6v10M10 8l4 2M10 12l4 2" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Redirect Message -->
            <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-600 via-blue-600 to-purple-600 bg-clip-text text-transparent mb-4">
                Redirecting to Leaf Intelligence
            </h1>
            
            <p class="text-gray-600 mb-6 text-lg">
                Please wait while we redirect you to our AI Research Platform...
            </p>

            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 rounded-full h-2 mb-6">
                <div class="bg-gradient-to-r from-emerald-500 via-blue-500 to-purple-500 h-2 rounded-full progress-bar"></div>
            </div>

            <!-- Manual Redirect Button -->
            <div class="space-y-4">
                <button onclick="window.location.href='leafintelligence.html'" 
                        class="w-full px-6 py-3 bg-gradient-to-r from-emerald-600 via-blue-600 to-purple-600 text-white rounded-lg hover:from-emerald-700 hover:via-blue-700 hover:to-purple-700 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-1 font-medium">
                    Continue to Leaf Intelligence
                </button>
                
                <p class="text-sm text-gray-500">
                    If you're not redirected automatically, click the button above
                </p>
            </div>

            <!-- Footer Info -->
            <div class="mt-8 pt-6 border-t border-gray-200">
                <div class="flex items-center justify-center space-x-2 text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <span class="text-sm">Secure 301 Redirect</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // JavaScript redirect as backup
        setTimeout(function() {
            if (!document.hidden) {
                window.location.href = 'leafintelligence.html';
            }
        }, 3000);
        
        // Handle visibility change (if user switches tabs)
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                // If user comes back to tab, redirect immediately
                window.location.href = 'leafintelligence.html';
            }
        });
        
        // Immediate redirect option for faster experience
        document.addEventListener('DOMContentLoaded', function() {
            // Optional: Uncomment the line below for immediate redirect
            window.location.href = 'leafintelligence.html';
        });
    </script>
</body>
</html>
