                                         indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'NPV Analysis ($ Millions)',
                            font: { size: 16, weight: 'bold' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: value => '$' + value.toLocaleString() + 'M' }
                        }
                    }
                }
            });
        }

        function createIRRChart() {
            const ctx = document.getElementById('irrChart');
            if (!ctx) return;

            new Chart(ctx.getContext('2d'), {
                type: 'line',
                data: {
                    labels: Object.values(treatmentDatabase).map(t => t.name),
                    datasets: [{
                        label: 'Expected IRR (%)',
                        data: Object.values(treatmentDatabase).map(t => t.financial.irr),
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Internal Rate of Return Comparison'
                        },
                        annotation: {
                            annotations: {
                                line1: {
                                    type: 'line',
                                    yMin: 15,
                                    yMax: 15,
                                    borderColor: 'rgb(255, 99, 132)',
                                    borderWidth: 2,
                                    label: {
                                        content: 'Hurdle Rate',
                                        enabled: true
                                    }
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 35,
                            ticks: { callback: value => value + '%' }
                        }
                    }
                }
            });
        }

        function createROIChart() {
            const ctx = document.getElementById('roiChart');
            if (!ctx) return;

            new Chart(ctx.getContext('2d'), {
                type: 'bubble',
                data: {
                    datasets: Object.entries(treatmentDatabase).map(([key, t]) => ({
                        label: t.name,
                        data: [{
                            x: t.financial.developmentCost,
                            y: t.financial.probabilityAdjustedNpv,
                            r: t.financial.irr/2
                        }],
                        backgroundColor: t.color + '80',
                        borderColor: t.color,
                        borderWidth: 2
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Investment Efficiency (Cost vs Return)'
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Development Cost ($M)' },
                            beginAtZero: true
                        },
                        y: {
                            title: { display: true, text: 'Risk-Adjusted NPV ($M)' },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function createCompetitiveMapChart() {
            const ctx = document.getElementById('competitiveMapChart');
            if (!ctx) return;

            new Chart(ctx.getContext('2d'), {
                type: 'scatter',
                data: {
                    datasets: Object.entries(treatmentDatabase).map(([key, t]) => ({
                        label: t.name,
                        data: [{
                            x: t.ptrs.clinical,
                            y: t.commercial.peakShare
                        }],
                        backgroundColor: t.color,
                        borderColor: t.color,
                        borderWidth: 2,
                        pointRadius: 10
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Competitive Positioning (Clinical Strength vs Market Potential)',
                            font: { size: 16, weight: 'bold' }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Clinical Success Probability (%)' },
                            min: 0,
                            max: 100
                        },
                        y: {
                            title: { display: true, text: 'Peak Market Share (%)' },
                            min: 0,
                            max: 50
                        }
                    }
                }
            });
        }

        function createRiskMatrixChart() {
            const ctx = document.getElementById('riskMatrixChart');
            if (!ctx) return;

            new Chart(ctx.getContext('2d'), {
                type: 'scatter',
                data: {
                    datasets: Object.entries(treatmentDatabase).map(([key, t]) => ({
                        label: t.name,
                        data: [{
                            x: 100 - t.ptrs.overall, // Risk = inverse of success probability
                            y: t.financial.probabilityAdjustedNpv/100 // Normalized return
                        }],
                        backgroundColor: t.color + '80',
                        borderColor: t.color,
                        borderWidth: 3,
                        pointRadius: 15
                    }))
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'Risk-Return Matrix',
                            font: { size: 16, weight: 'bold' }
                        },
                        annotation: {
                            annotations: {
                                quadrant1: {
                                    type: 'box',
                                    xMin: 0,
                                    xMax: 50,
                                    yMin: 20,
                                    yMax: 40,
                                    backgroundColor: 'rgba(0, 255, 0, 0.1)',
                                    borderWidth: 0
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Risk Level (100 - PTRS %)' },
                            min: 0,
                            max: 100
                        },
                        y: {
                            title: { display: true, text: 'Risk-Adjusted Return (NPV/100)' },
                            min: 0,
                            max: 40
                        }
                    }
                }
            });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', initializeReport);
    </script>
</body>
</html>
