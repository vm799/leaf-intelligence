<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FDA Drug Manufacturer Intelligence Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }
    
    .loading-spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .card-hover {
      transition: all 0.3s ease;
      border: 1px solid #e5e7eb;
    }
    
    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15);
      border-color: #3b82f6;
    }
    
    .compliance-card {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .compliance-card:hover {
      background-color: #f9fafb;
    }
    
    .modal {
      display: none;
      position: fixed;
      z-index: 50;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }
    
    .modal.active {
      display: block;
    }
    
    .modal-content {
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-weight: 500;
    }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    
    .status-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
    }
    
    .data-row {
      display: grid;
      grid-template-columns: 200px 1fr;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f3f4f6;
    }
    
    .data-row:last-child {
      border-bottom: none;
    }
    
    .data-label {
      font-weight: 500;
      color: #6b7280;
      font-size: 0.875rem;
    }
    
    .data-value {
      color: #111827;
      font-size: 0.875rem;
    }
    
    .tab-button {
      padding: 0.75rem 1.5rem;
      font-weight: 500;
      color: #6b7280;
      border-bottom: 2px solid transparent;
      transition: all 0.2s ease;
      cursor: pointer;
      position: relative;
    }
    
    .tab-button:hover {
      color: #3b82f6;
      background-color: #f9fafb;
    }
    
    .tab-button.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
      background-color: #eff6ff;
    }

    .tab-button .tab-count {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: #e5e7eb;
      color: #6b7280;
      font-size: 0.75rem;
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      min-width: 1.5rem;
      text-align: center;
    }

    .tab-button.active .tab-count {
      background: #3b82f6;
      color: white;
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    
    .truncate-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .metric-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #e5e7eb;
      transition: all 0.2s ease;
    }
    
    .metric-card:hover {
      border-color: #3b82f6;
      box-shadow: 0 4px 12px -2px rgba(59, 130, 246, 0.15);
    }
    
    .compliance-timeline {
      position: relative;
      padding-left: 2rem;
    }
    
    .compliance-timeline::before {
      content: '';
      position: absolute;
      left: 0.5rem;
      top: 0.5rem;
      bottom: 0;
      width: 2px;
      background: #e5e7eb;
    }
    
    .timeline-item {
      position: relative;
      padding-bottom: 1.5rem;
    }
    
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -1.5rem;
      top: 0.5rem;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
      border: 2px solid white;
      box-shadow: 0 0 0 4px #eff6ff;
    }

    .compliance-item {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 1.5rem;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .compliance-item:hover {
      border-color: #d1d5db;
      box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.1);
    }

    .compliance-item-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 1rem;
    }

    .severity-indicator {
      width: 4px;
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
    }

    .severity-high { background-color: #ef4444; }
    .severity-medium { background-color: #f59e0b; }
    .severity-low { background-color: #3b82f6; }
    .severity-info { background-color: #8b5cf6; }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #6b7280;
    }

    .empty-state svg {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1rem;
      color: #d1d5db;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .info-item {
      background: #f9fafb;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #e5e7eb;
    }

    .info-label {
      font-size: 0.75rem;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .info-value {
      font-size: 0.875rem;
      color: #111827;
      font-weight: 500;
    }

    .timeline-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 1rem;
    }

    .classification-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
    }

    .classification-OAI {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .classification-VAI {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .classification-NAI {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .action-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.025em;
    }

    .action-warning {
      background-color: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
    }

    .action-seizure {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .action-injunction {
      background-color: #e0e7ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
    }

    .modal-overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .overview-card {
      background: #f9fafb;
      padding: 1.5rem;
      border-radius: 0.75rem;
      text-align: center;
      border: 1px solid #e5e7eb;
    }

    .overview-number {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .overview-label {
      font-size: 0.875rem;
      color: #6b7280;
    }
  </style>
</head>

<section class="bg-gray-50">
  <!-- Header -->
  <header class="gradient-bg text-white shadow-lg">
    <div class="container mx-auto px-6 py-8">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold">FDA Drug Manufacturer Intelligence</h1>
          <p class="text-purple-100 mt-2">Comprehensive compliance and manufacturing data analysis</p>
        </div>
        <div class="flex items-center gap-4">
          <span class="text-sm text-purple-100">Powered by FDA Data Dashboard API</span>
          <button onclick="showAboutModal()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm font-medium transition">
            About
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-6 py-8">
    <!-- Search Section -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-8">
      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="lg:col-span-2">
          <label for="compound" class="block text-sm font-semibold text-gray-900 mb-2">
            Drug Compound Name
          </label>
          <div class="relative">
            <input 
              type="text" 
              id="compound" 
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg"
              placeholder="e.g., ketamine, ibuprofen, acetaminophen"
            >
            <svg class="absolute right-3 top-3.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </div>
          <div class="mt-4">
            <div id="popular-searches"></div>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-2">
            Search Options
          </label>
          <div class="space-y-3">
            <label class="flex items-center">
              <input type="checkbox" id="includeGeneric" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
              <span class="ml-2 text-sm text-gray-700">Generic names</span>
            </label>
            <label class="flex items-center">
              <input type="checkbox" id="includeBrand" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
              <span class="ml-2 text-sm text-gray-700">Brand names</span>
            </label>
            <label class="flex items-center">
              <input type="checkbox" id="fetchCompliance" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500">
              <span class="ml-2 text-sm text-gray-700">Fetch compliance data</span>
            </label>
          </div>
        </div>
        
        <div class="flex flex-col justify-end gap-3">
          <button 
            id="searchBtn"
            onclick="performSearch()"
            class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition flex items-center justify-center gap-2"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            Search Manufacturers
          </button>
          <button 
            id="exportBtn"
            class="hidden bg-green-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-green-700 transition flex items-center justify-center gap-2"
            onclick="exportResults()"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Export Report
          </button>
        </div>
      </div>
    </div>

    <!-- Stats Section -->
    <div id="stats" class="hidden mb-8">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="metric-card">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-medium text-gray-600">Total Manufacturers</p>
              <p class="text-3xl font-bold text-gray-900 mt-1" id="totalManufacturers">0</p>
            </div>
            <div class="bg-blue-100 p-3 rounded-lg">
              <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              </svg>
            </div>
          </div>
        </div>
        
        <div class="metric-card">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-medium text-gray-600">With FEI Numbers</p>
              <p class="text-3xl font-bold text-green-600 mt-1" id="withFEI">0</p>
            </div>
            <div class="bg-green-100 p-3 rounded-lg">
              <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
          </div>
        </div>
        
        <div class="metric-card">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-medium text-gray-600">Total FEI Numbers</p>
              <p class="text-3xl font-bold text-purple-600 mt-1" id="totalFEI">0</p>
            </div>
            <div class="bg-purple-100 p-3 rounded-lg">
              <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
              </svg>
            </div>
          </div>
        </div>
        
        <div class="metric-card">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-medium text-gray-600">Without FEI</p>
              <p class="text-3xl font-bold text-orange-600 mt-1" id="withoutFEI">0</p>
            </div>
            <div class="bg-orange-100 p-3 rounded-lg">
              <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="hidden">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-12 text-center">
        <div class="loading-spinner mx-auto mb-4"></div>
        <p class="text-lg font-medium text-gray-900">Searching FDA databases...</p>
        <p class="text-sm text-gray-500 mt-2">This may take a few moments</p>
        <p class="text-xs text-gray-400 mt-2" id="loadingStatus"></p>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results" class="space-y-6"></div>
  </main>

  <!-- Enhanced Modal -->
  <div id="complianceModal" class="modal">
    <div class="modal-content bg-white rounded-xl shadow-2xl max-w-7xl mx-auto mt-10 mb-10 max-h-[90vh] overflow-hidden">
      <!-- Modal Header -->
      <div class="gradient-bg text-white p-6">
        <div class="flex justify-between items-start">
          <div>
            <h2 class="text-2xl font-bold" id="modalTitle">Compliance Details</h2>
            <p class="text-purple-100 mt-1" id="modalSubtitle"></p>
          </div>
          <button onclick="closeModal()" class="text-white hover:text-gray-200 transition p-2 hover:bg-white/10 rounded-lg">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
      
      <!-- Modal Body -->
      <div class="bg-gray-50">
        <!-- Overview Stats -->
        <div id="modalOverview" class="bg-white px-6 py-4 border-b border-gray-200"></div>
        
        <!-- Tabs -->
        <div class="bg-white border-b border-gray-200 px-6">
          <div class="flex overflow-x-auto" id="modalTabs">
            <!-- Dynamic tabs will be inserted here -->
          </div>
        </div>
        
        <!-- Tab Content -->
        <div class="p-6 overflow-y-auto" style="max-height: calc(90vh - 300px)">
          <div id="modalContent">
            <!-- Dynamic content will be inserted here -->
          </div>
        </div>
      </div>
    </div>
  </div>
</section>


  <script>
    let currentResults = null;
    let currentModalData = null;
    let activeTab = 'overview';

    const terms = ['ketamine', 'ibuprofen', 'acetaminophen', 'insulin', 'metformin'];

    document.getElementById('popular-searches').innerHTML = `
      <div class="flex flex-wrap items-center gap-2">
        <span class="text-sm text-gray-600">Popular searches:</span>
        ${terms.map(ex => `
          <button 
            class="text-sm text-blue-600 hover:text-blue-800 font-medium bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded transition"
            onclick="document.getElementById('compound').value='${ex}'; performSearch()"
          >
            ${ex}
          </button>
        `).join('')}
      </div>
    `;

    document.getElementById('compound').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    async function performSearch() {
      const compound = document.getElementById('compound').value.trim();
      const includeGeneric = document.getElementById('includeGeneric').checked;
      const includeBrand = document.getElementById('includeBrand').checked;
      const fetchCompliance = document.getElementById('fetchCompliance').checked;
      
      if (!compound) {
        showNotification('Please enter a drug compound name', 'error');
        return;
      }

      // Reset UI
      document.getElementById('loading').classList.remove('hidden');
      document.getElementById('results').innerHTML = '';
      document.getElementById('stats').classList.add('hidden');
      document.getElementById('exportBtn').classList.add('hidden');
      
      if (fetchCompliance) {
        document.getElementById('loadingStatus').textContent = 'Fetching compliance data for all facilities...';
      }

      try {
        const params = new URLSearchParams({
          compound: compound,
          includeGeneric: includeGeneric,
          includeBrand: includeBrand,
          fetchCompliance: fetchCompliance
        });

        const response = await fetch(`/api/fei/drug-compound/manufacturers?${params}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to fetch data');
        }

        currentResults = data;
        displayResults(data);

      } catch (error) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('results').innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-xl p-6">
            <div class="flex items-center gap-3">
              <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
              <div>
                <p class="font-semibold text-red-900">Error</p>
                <p class="text-red-700">${error.message}</p>
              </div>
            </div>
          </div>
        `;
      }
    }

    function displayResults(data) {
      document.getElementById('loading').classList.add('hidden');
      
      if (data.total_manufacturers === 0) {
        document.getElementById('results').innerHTML = `
          <div class="bg-yellow-50 border border-yellow-200 rounded-xl p-6">
            <div class="flex items-center gap-3">
              <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
              </svg>
              <div>
                <p class="font-semibold text-yellow-900">No manufacturers found</p>
                <p class="text-yellow-700">No manufacturers were found for "${data.compound}". Try searching with different spelling or check if it's a brand name.</p>
              </div>
            </div>
          </div>
        `;
        return;
      }

      // Update stats
      document.getElementById('totalManufacturers').textContent = data.total_manufacturers;
      document.getElementById('withFEI').textContent = data.manufacturers_with_fei;
      document.getElementById('totalFEI').textContent = data.total_fei_numbers || 0;
      document.getElementById('withoutFEI').textContent = data.total_manufacturers - data.manufacturers_with_fei;

    function showComplianceModal(mIndex, estIndex) {

        { id: 'overview', label: 'Overview', icon: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z' },
        { id: 'classifications', label: 'Inspection Classifications', count: stats.classifications, color: 'purple' },
        { id: 'citations', label: 'Citations', count: stats.citations, color: 'red' },
        { id: 'actions', label: 'Compliance Actions', count: stats.actions, color: 'orange' },
        { id: 'refusals', label: 'Import Refusals', count: stats.refusals, color: 'yellow' }
      ];
      
      const tabsHtml = tabs.map(tab => `
        <button 
          class="tab-button ${activeTab === tab.id ? 'active' : ''}" 
          onclick="switchTab('${tab.id}')"
          id="tab-${tab.id}"
        >
          ${tab.icon ? `
            <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${tab.icon}"></path>
            </svg>
          ` : ''}
          ${tab.label}
          ${tab.count !== undefined ? `<span class="tab-count">${tab.count}</span>` : ''}
        </button>
      `).join('');
      
      document.getElementById('modalTabs').innerHTML = tabsHtml;
      
      // Show initial content
      updateModalContent();
      
      document.getElementById('complianceModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function switchTab(tabId) {
      activeTab = tabId;
      
      // Update active tab styling
      document.querySelectorAll('.tab-button').forEach(btn => {
        btn.classList.remove('active');
      });
      document.getElementById(`tab-${tabId}`).classList.add('active');
      
      updateModalContent();
    }

          content = renderComplianceTab(
            'Inspection Classifications',
            complianceData.inspections_classifications || [],
            'purple',
            getClassificationExplanation()
          );
          break;
        case 'citations':
          content = renderComplianceTab(
            'Inspection Citations',
            complianceData.inspections_citations || [],
            'red',
            getCitationExplanation()
          );
          break;
        case 'actions':
          content = renderComplianceTab(
            'Compliance Actions',
            complianceData.compliance_actions || [],
            'orange',
            getActionExplanation()
          );
          break;
        case 'refusals':
          content = renderComplianceTab(
            'Import Refusals',
            complianceData.import_refusals || [],
            'yellow',
            getRefusalExplanation()
          );
          break;
      }
      
      document.getElementById('modalContent').innerHTML = content;
    }

    function renderComplianceSummaryItem(title, data, color) {
      const colorMap = {
        purple: 'bg-purple-100 text-purple-800',
        red: 'bg-red-100 text-red-800',
        orange: 'bg-orange-100 text-orange-800',
        yellow: 'bg-yellow-100 text-yellow-800'
      };
      
      const mostRecent = data.length > 0 ? 
        data.sort((a, b) => {
          const dateA = new Date(a.InspectionEndDate || a.ActionTakenDate || a.RefusalDate || 0);
          const dateB = new Date(b.InspectionEndDate || b.ActionTakenDate || b.RefusalDate || 0);
          return dateB - dateA;
        })[0] : null;
      
      const recentDate = mostRecent ? 
        (mostRecent.InspectionEndDate || mostRecent.ActionTakenDate || mostRecent.RefusalDate) : null;
      
      return `
        <div class="flex items-center justify-between p-3 rounded-lg ${colorMap[color].split(' ')[0]}">
          <div>
            <p class="font-medium text-gray-900">${title}</p>
            ${recentDate ? `
              <p class="text-sm text-gray-600 mt-1">Most recent: ${formatDate(recentDate)}</p>
            ` : ''}
          </div>
          <span class="text-2xl font-bold ${colorMap[color].split(' ')[1]}">${data.length}</span>
        </div>
      `;
    }

    function renderComplianceTab(title, data, color, explanation) {
      if (!currentResults.compliance_data_fetched) {
        return `
          <div class="empty-state">
            <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
            </svg>
            <p class="text-lg font-medium text-gray-700">Compliance data not available</p>
            <p class="text-sm text-gray-500 mt-2">Enable "Fetch compliance data" when searching to see this information</p>
          </div>
        `;
      }
      
      if (!data || data.length === 0) {
        return `
          <div class="empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <p class="text-lg font-medium text-gray-700">No ${title.toLowerCase()} found</p>
            <p class="text-sm text-gray-500 mt-2">This facility has no recorded ${title.toLowerCase()} in the FDA database</p>
          </div>
        `;
      }
      
      const sortedData = [...data].sort((a, b) => {
        const dateA = new Date(a.InspectionEndDate || a.ActionTakenDate || a.RefusalDate || 0);
        const dateB = new Date(b.InspectionEndDate || b.ActionTakenDate || b.RefusalDate || 0);
        return dateB - dateA;
      });
      
      return `
      <div class="space-y-6">
          ${explanation}
          
          <div class="timeline-indicator">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            Showing ${sortedData.length} record${sortedData.length !== 1 ? 's' : ''} in chronological order
          </div>
          
          <div class="space-y-4">
            ${sortedData.map((item, index) => renderComplianceItem(item, index, title, color)).join('')}
          </div>
        </div>
      `;
    }

    function renderComplianceItem(item, index, type, color) {
      const severityClass = `severity-${color === 'red' ? 'high' : color === 'orange' ? 'medium' : color === 'yellow' ? 'low' : 'info'}`;
      const date = item.InspectionEndDate || item.ActionTakenDate || item.RefusalDate;
      
      return `
        <div class="compliance-item">
          <div class="${severityClass} severity-indicator"></div>
          
          <div class="compliance-item-header">
            <div class="flex-1">
              <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-gray-500">#${index + 1}</span>
                ${date ? `
                  <span class="text-sm text-gray-600">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    ${formatDate(date)}
                  </span>
                ` : ''}
                ${renderSpecialBadges(item)}
              </div>
              <button 
                onclick="toggleRawData(${index})" 
                class="text-xs text-blue-600 hover:text-blue-800 mt-2"
              >
                <svg class="w-3 h-3 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                </svg>
                View Raw Data
              </button>
            </div>
          </div>
          
          <div class="mt-4" id="details-${activeTab}-${index}">
            ${renderItemDetails(item, type)}
          </div>
          
          <div class="mt-4 hidden" id="raw-${activeTab}-${index}">
            <div class="bg-gray-900 text-gray-100 p-4 rounded-lg overflow-x-auto">
              <pre class="text-xs"><code>${JSON.stringify(item, null, 2)}</code></pre>
            </div>
          </div>
        </div>
      `;
    }

    function renderSpecialBadges(item) {
      let badges = '';
      
      // Classification badges
      if (item.Classification) {
        const classMap = {
          'OAI': 'Official Action Indicated',
          'VAI': 'Voluntary Action Indicated',
          'NAI': 'No Action Indicated'
        };
        badges += `<span class="classification-badge classification-${item.Classification}">${item.Classification} - ${classMap[item.Classification] || item.Classification}</span>`;
      }
      
      // Action type badges
      if (item.ActionType) {
        const actionClass = item.ActionType.toLowerCase().includes('warning') ? 'warning' : 
                          item.ActionType.toLowerCase().includes('seizure') ? 'seizure' : 'injunction';
        badges += `<span class="action-badge action-${actionClass}">${item.ActionType}</span>`;
      }
      
      return badges;
    }
function renderItemDetails(item, type) {
      // Comprehensive field label mappings for all possible fields
      const fieldLabels = {
        // Common fields
        FEINumber: 'FEI Number',
        
        // Inspection Classification fields
        InspectionID: 'Inspection ID',
        InspectionStartDate: 'Inspection Start Date',
        InspectionEndDate: 'Inspection End Date',
        Classification: 'Classification Code',
        ClassificationDescription: 'Classification Description',
        
        // Citation fields
        CitationID: 'Citation ID',
        CitationDescription: 'Citation Description',
        
        // Compliance Action fields
        ActionType: 'Action Type',
        ActionTakenDate: 'Action Taken Date',
        CaseNumber: 'Case Number',
        ProductCategory: 'Product Category',
        CaseStatus: 'Case Status',
        RecallNumber: 'Recall Number',
        VoluntaryMandated: 'Voluntary/Mandated',
        InitialFirmNotificationDate: 'Initial Firm Notification',
        DistributionPattern: 'Distribution Pattern',
        
        // Import Refusal fields
        ShipmentID: 'Shipment ID',
        RefusalDate: 'Refusal Date',
        ProductCodeDescription: 'Product Code Description',
        RefusalCharges: 'Refusal Charges',
        FDASampleAnalysis: 'FDA Sample Analysis',
        PrivateLabAnalysis: 'Private Lab Analysis',
        ShipmentDescription: 'Shipment Description',
        ManufacturerName: 'Manufacturer Name',
        ShipperName: 'Shipper Name',
        ConsigneeName: 'Consignee Name',
        CountryCode: 'Country Code',
        EntryNumber: 'Entry Number',
        LineNumber: 'Line Number',
        PortOfEntry: 'Port of Entry',
        Quantity: 'Quantity',
        QuantityUnit: 'Quantity Unit',
        Value: 'Value',
        
        // Additional fields that might appear
        InspectorName: 'Inspector Name',
        InspectionType: 'Inspection Type',
        Program: 'Program',
        ProgramArea: 'Program Area',
        PostalCode: 'Postal Code',
        RegistrationNumber: 'Registration Number',
        Reason: 'Reason',
        ReasonDescription: 'Reason Description',
        Status: 'Status',
        ComplianceStatus: 'Compliance Status',
        District: 'District',
        CenterCode: 'Center Code'
      };
      
      // Fields that should be displayed as full-width due to longer content
      const fullWidthFields = [
        'ClassificationDescription',
        'CitationDescription',
        'RefusalCharges',
        'ProductCodeDescription',
        'ShipmentDescription',
        'ReasonDescription',
        'DistributionPattern'
      ];
      
      // Fields that should be highlighted as important
      const importantFields = [
        'InspectionID',
        'Classification',
        'CitationID',
        'ActionType',
        'ShipmentID',
        'CaseNumber',
        'RecallNumber'
      ];
      
      // Get all fields from the item except FEINumber
      const allFields = Object.entries(item)
        .filter(([key, value]) => key !== 'FEINumber' && value !== null && value !== undefined && value !== '')
        .map(([key, value]) => ({
          key,
          value,
          label: fieldLabels[key] || key.replace(/([A-Z])/g, ' $1').trim(),
          isFullWidth: fullWidthFields.includes(key),
          isImportant: importantFields.includes(key)
        }));
      
      // Separate regular and full-width fields
      const regularFields = allFields.filter(f => !f.isFullWidth);
      const fullWidth = allFields.filter(f => f.isFullWidth);
      
      // Group related fields together for better organization
      const fieldGroups = {
        'Identification': ['InspectionID', 'CitationID', 'ShipmentID', 'CaseNumber', 'RecallNumber', 'EntryNumber'],
        'Dates': ['InspectionStartDate', 'InspectionEndDate', 'ActionTakenDate', 'RefusalDate', 'InitialFirmNotificationDate'],
        'Classification': ['Classification', 'ClassificationDescription', 'ActionType', 'CitationDescription'],
        'Product Info': ['ProductCategory', 'ProductCodeDescription', 'ShipmentDescription'],
        'Analysis': ['FDASampleAnalysis', 'PrivateLabAnalysis'],
        'Parties': ['ManufacturerName', 'ShipperName', 'ConsigneeName'],
        'Location': ['CountryCode', 'PortOfEntry', 'District', 'PostalCode'],
        'Quantity': ['Quantity', 'QuantityUnit', 'Value'],
        'Status': ['Status', 'ComplianceStatus', 'CaseStatus', 'VoluntaryMandated'],
        'Other': []
      };
      
      // Organize fields into groups
      const organizedGroups = {};
      regularFields.forEach(field => {
        let placed = false;
        for (const [groupName, groupFields] of Object.entries(fieldGroups)) {
          if (groupFields.includes(field.key)) {
            if (!organizedGroups[groupName]) organizedGroups[groupName] = [];
            organizedGroups[groupName].push(field);
            placed = true;
            break;
          }
        }
        if (!placed) {
          if (!organizedGroups['Other']) organizedGroups['Other'] = [];
          organizedGroups['Other'].push(field);
        }
      });
      
      // Remove empty groups
      Object.keys(organizedGroups).forEach(key => {
        if (organizedGroups[key].length === 0) delete organizedGroups[key];
      });
      
      return `
        ${Object.entries(organizedGroups).map(([groupName, fields]) => {
          if (fields.length === 0) return '';
          
          return `
            <div class="mb-6">
              <h5 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">${groupName}</h5>
              <div class="info-grid">
                ${fields.map(field => `
                  <div class="info-item">
                    <div class="info-label">${field.label}</div>
                    <div class="info-value ${field.isImportant ? 'font-semibold text-gray-900' : ''}">${field.value}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).filter(Boolean).join('')}
        
        ${fullWidth.length > 0 ? `
          <div class="mt-6">
            <h5 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Detailed Information</h5>
            ${fullWidth.map(field => `
              <div class="mt-4 p-4 bg-gray-50 rounded-lg">
                <div class="info-label mb-2">${field.label}</div>
                <div class="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">${field.value}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}
        
        ${allFields.length === 0 ? `
          <div class="text-center py-8 text-gray-500">
            <p>No additional details available for this record</p>
          </div>
        ` : ''}
      `;
    }

// New function to fetch and display warning letter
async function fetchAndDisplayWarningLetter(caseNumber) {
  const container = document.getElementById(`warning-letter-${caseNumber}`);
  if (!container) return;
  
  const letterData = await fetchWarningLetterDetails(caseNumber);
  
  if (letterData) {
    container.innerHTML = `
      <h5 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Related Warning Letter</h5>
      <div class="bg-white rounded-lg border border-blue-200 p-4">
        <div class="mb-3">
          <p class="text-sm font-semibold text-gray-900">${letterData.companyName}</p>
          <p class="text-xs text-gray-600 mt-1">Letter ID: ${letterData.letterId}</p>
          <p class="text-xs text-gray-600">Issue Date: ${formatDate(letterData.letterIssueDate)}</p>
        </div>
        <div class="mb-3">
          <p class="text-xs font-semibold text-gray-700 uppercase mb-1">Subject</p>
          <p class="text-sm text-gray-800">${letterData.subject}</p>
        </div>
        <button 
          onclick="showWarningLetterModal('${letterData.letterId}')"
          class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-medium"
        >
          View Full Warning Letter
        </button>
      </div>
    `;
  } else {
    container.innerHTML = `
      <h5 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Related Warning Letter</h5>
      <div class="bg-gray-50 rounded-lg p-4 text-center">
        <p class="text-sm text-gray-500">No warning letter found with ID: ${caseNumber}</p>
      </div>
    `;
  }
}

    function toggleRawData(index) {
      const detailsEl = document.getElementById(`details-${activeTab}-${index}`);
      const rawEl = document.getElementById(`raw-${activeTab}-${index}`);
      
      if (detailsEl.classList.contains('hidden')) {
        detailsEl.classList.remove('hidden');
        rawEl.classList.add('hidden');
      } else {
        detailsEl.classList.add('hidden');
        rawEl.classList.remove('hidden');
      }
    }

    function closeModal() {
      document.getElementById('complianceModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      const date = new Date(dateString);
      return date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });
    }

    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg z-50 ${
        type === 'error' ? 'bg-red-500' : 'bg-green-500'
      } text-white`;
      notification.textContent = message;
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }
// Add this function to fetch warning letter details by ID
async function fetchWarningLetterDetails(letterId) {
  try {
    const response = await fetch(`/api/wl/letter/${letterId}`);
    if (!response.ok) {
      throw new Error('Warning letter not found');
    }
    const data = await response.json();
    return data;
  } catch (error) {
    console.error('Error fetching warning letter:', error);
    return null;
  }
}

// Add this function to search warning letters by company name
async function searchWarningLettersByCompany(companyName) {
  try {
    const params = new URLSearchParams({
      term: companyName,
      field: 'company',
      perPage: 100 // Get more results to show all related letters
    });
    
    const response = await fetch(`/api/wl/search?${params}`);
    if (!response.ok) {
      throw new Error('Failed to search warning letters');
    }
    const data = await response.json();
    return data.results || [];
  } catch (error) {
    console.error('Error searching warning letters:', error);
    return [];
  }
}
    function exportResults() {
      if (!currentResults) return;
      
      let csv = 'Manufacturer Name,FEI Number,Facility Name,Address,City,State,Country,Source,Classifications,Citations,Actions,Refusals,Products\n';
      
      currentResults.manufacturers.forEach(m => {
        if (m.fei_establishments && m.fei_establishments.length > 0) {
          m.fei_establishments.forEach(est => {
            const classifications = est.compliance_data?.inspections_classifications?.length || 0;
            const citations = est.compliance_data?.inspections_citations?.length || 0;
            const actions = est.compliance_data?.compliance_actions?.length || 0;
            const refusals = est.compliance_data?.import_refusals?.length || 0;
            
            csv += `"${m.manufacturer_name}","${est.fei_number}","${est.firm_name || ''}","${est.address || ''}","${est.city || ''}","${est.state || ''}","${est.country || ''}","${est.source}","${classifications}","${citations}","${actions}","${refusals}","${m.products.length + m.ndc_products.length}"\n`;
          });
        } else {
          csv += `"${m.manufacturer_name}","N/A","","","","","","No FEI Found","0","0","0","0","${m.products.length + m.ndc_products.length}"\n`;
        }
      });
      
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${currentResults.compound}_manufacturers_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
      
      showNotification('Export completed successfully', 'success');
    }

    }
