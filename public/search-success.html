<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful - Syneticx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl text-center max-w-md w-full">
            <div class="text-green-500 mb-6 float-animation">
                <svg class="w-24 h-24 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                </svg>
            </div>
            <h1 class="text-3xl font-bold mb-4 text-gray-800">Payment Successful!</h1>
            <p class="text-gray-600 mb-8">Your search has been unlocked. You now have full access to all features for this search.</p>
            
            <div class="mb-8">
                <div class="bg-blue-50 rounded-lg p-4 mb-4">
                    <p class="text-sm text-blue-800 font-medium">What's included:</p>
                    <ul class="text-sm text-blue-700 mt-2 space-y-1 text-left">
                        <li>✓ Complete FDA regulatory data</li>
                        <li>✓ All clinical trial information</li>
                        <li>✓ Response and warning letters</li>
                        <li>✓ Advanced analytics</li>
                    </ul>
                </div>
            </div>
            
            <div class="relative">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                <p class="text-sm text-gray-500 mt-4">Redirecting to your search results...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Handle redirect
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        const searchQuery = urlParams.get('search') || localStorage.getItem('pendingSearchQuery') || '';
        
        // Verify session and redirect
        setTimeout(() => {
            if (searchQuery) {
                window.location.href = `/?q=${encodeURIComponent(searchQuery)}&paid=true&session=${sessionId}`;
            } else {
                window.location.href = '/?paid=true';
            }
        }, 3000);
        
        // Clear pending search
        localStorage.removeItem('pendingSearchQuery');
    </script>
</body>
</html>
